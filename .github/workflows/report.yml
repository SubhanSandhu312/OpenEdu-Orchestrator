name: Build report PDF

# Only runs when the report itself changes -- the .tex sources are edited
# rarely, and a full TeX Live image is a slow job to run on every push.
# workflow_dispatch lets you trigger a build by hand from the Actions tab.
on:
  push:
    paths:
      - "report/**"
      - ".github/workflows/report.yml"
  pull_request:
    paths:
      - "report/**"
      - ".github/workflows/report.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Revision 2
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report
          root_file: OpenEdu_Orchestrator_Report_v2.tex
          # Default compiler is latexmk, which reruns pdflatex as many times
          # as needed to resolve the table of contents and \ref cross-references
          # -- the reason the manual build in report/README.md says "run twice".

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: OpenEdu_Orchestrator_Report_v2
          path: report/OpenEdu_Orchestrator_Report_v2.pdf
          # Fail loudly rather than silently publishing an empty artifact if
          # the compile step somehow produced no PDF.
          if-no-files-found: error
